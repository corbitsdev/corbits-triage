# Corbits Triage policy.
rules:
  - check: max-files-changed
    text: Flag pull requests over 30 files changed.
    max: 30
    onFail: ask
    reason: Set in the portal before the policy file.
    evidence:
      - maintainer-stated
  - check: max-lines-changed
    text: Flag pull requests over 5,000 lines changed.
    max: 5000
    onFail: ask
    reason: Set in the portal before the policy file.
    evidence:
      - maintainer-stated
  - check: focused
    text: Check the change is focused on one thing.
    reason: Set in the portal before the policy file.
    evidence:
      - maintainer-stated
  - check: docs
    text: Check docs are updated when behavior changes.
    reason: Set in the portal before the policy file.
    evidence:
      - maintainer-stated
    enabled: false
  - check: linked-issue
    text: Require a linked issue from GitHub or Linear.
    tracker: either
    reason: Set in the portal before the policy file.
    evidence:
      - maintainer-stated
  - check: no-merge-conflicts
    text: Flag merge conflicts with the base branch.
    reason: Set in the portal before the policy file.
    evidence:
      - maintainer-stated
  - check: ci-green
    text: CI must pass before merge.
    reason: Set in the portal before the policy file.
    evidence:
      - maintainer-stated
  - check: no-forbidden-paths
    text: Never accept changes to node_modules/**.
    paths:
      - node_modules/**
    reason: Set in the portal before the policy file.
    evidence:
      - maintainer-stated
  - check: conventional-commits
    text: Titles and commits follow Conventional Commits.
    reason: Commits and pull request titles use feat/fix/chore(scope).
    evidence:
      - maintainer-stated
  - check: hidden-content
    text: Flag text hidden in the pull request.
    reason: Hidden text can steer the rules a model judges.
    evidence:
      - maintainer-stated
  - check: no-duplicate
    text: Flag a pull request whose diff or commits match another open one.
    reason: Two pull requests for the same change waste a review; the earlier one stays.
    evidence:
      - maintainer-stated
  - check: duplicates-open-pull-request
    text: Ask when a pull request overlaps another open one.
    reason: A near duplicate needs a person to pick which one goes on.
    evidence:
      - maintainer-stated
  - check: sensitive-paths
    text: Route schema, migration, auth and secret changes to a person.
    reason: A schema or auth change is hard to undo; CI config and lockfiles are noted.
    evidence:
      - maintainer-stated
  - check: risk
    text: Ask about high-risk pull requests and label medium-risk ones.
    reason: A large change with no test touched needs a maintainer's eye.
    evidence:
      - maintainer-stated
  - id: no-ai-attribution
    check: text
    text: Titles, descriptions and commits carry no AI attribution.
    fields: [title, description, commits]
    failWhen: contains
    phrases:
      - "Co-Authored-By:"
      - "Claude-Session:"
      - "claude.ai/code/session"
      - "noreply@anthropic.com"
      - "Generated with Claude"
      - "Generated with [Claude"
    reason: No AI co-author lines, session trailers or links, or generated-with footers.
    evidence:
      - maintainer-stated
  - id: conventions
    check: code-patterns
    text: Added code follows the repository's conventions.
    presets:
      - convention
    onFail: label
    reason: AGENTS.md rules out invented fallbacks, nested ternaries, IIFEs and promise chains.
    evidence:
      - maintainer-stated
  - id: code-breaks-runs-or-leaks
    check: code-patterns
    text: Added code keeps stdout out of workflows, request URLs and query values out of logs, dynamic imports in the portal and environment reads out of tests.
    patterns:
      - id: no-stdout-in-workflows
        language: typescript
        message: Writes to stdout, Interchange's control channel, where a stray line crashes the run; log through @intx/log.
        files: [packages/triage-workflows/src/**, packages/pr-code-review*/src/**, packages/pr-workflow*/src/**]
        ignores: ["**/*.{test,spec}.*", "**/{test,tests,Tests,__tests__}/**", "**/*.*{Test,Tests}/**"]
        rule:
          any:
            - pattern: console.log($$$)
            - pattern: console.info($$$)
            - pattern: console.debug($$$)
            - pattern: process.stdout.write($$$)
      - id: no-stdout-in-workflows
        language: javascript
        message: Writes to stdout, Interchange's control channel, where a stray line crashes the run; log through @intx/log.
        files: [packages/triage-workflows/src/**, packages/pr-code-review*/src/**, packages/pr-workflow*/src/**]
        ignores: ["**/*.{test,spec}.*", "**/{test,tests,Tests,__tests__}/**", "**/*.*{Test,Tests}/**"]
        rule:
          any:
            - pattern: console.log($$$)
            - pattern: console.info($$$)
            - pattern: console.debug($$$)
            - pattern: process.stdout.write($$$)
      - id: no-request-url-in-logs
        language: typescript
        message: Logs a full request URL or a query value, which can hold a secret such as a GitHub manifest code; log the pathname, and give honoLogger a format that does.
        rule:
          any:
            - any:
                - { kind: member_expression, regex: '^(\w+\.)*(req|request|raw)\.url$' }
                - { kind: new_expression, regex: '^new URL\(\s*(\w+\.)*(req|request|raw)\.url\b' }
                - { kind: call_expression, has: { field: function, regex: '(^|\.)searchParams\.(get|getAll|toString|entries|values)$' } }
                - { kind: call_expression, has: { field: function, regex: '^(\w+\.)*(req|request)\.(query|queries)$' } }
              inside:
                stopBy: { not: { any: [{ kind: object }, { kind: pair }, { kind: array }, { kind: template_string }, { kind: template_substitution }, { kind: parenthesized_expression }, { kind: as_expression }, { kind: non_null_expression }, { kind: satisfies_expression }, { kind: await_expression }, { kind: binary_expression, has: { field: operator, regex: '^(\+|\?\?|\|\|)$' } }, { kind: member_expression, has: { field: property, regex: '^(href|search|toString)$' } }, { kind: call_expression, has: { field: function, regex: '(\.toString|^String|^JSON\.stringify)$' } }, { kind: arguments, inside: { kind: call_expression, has: { field: function, regex: '^(String|JSON\.stringify)$' } } }] } }
                kind: arguments
                inside:
                  kind: call_expression
                  has: { field: function, regex: '^(console\.\w+|logJson|honoLogger|(\w+\.)*log|(\w+\.)*(log|logger)\.(trace|debug|info|warn|warning|error|fatal)|getLogger\([^)]*\)\.(trace|debug|info|warn|warning|error|fatal))$' }
                  not: { has: { field: function, regex: '^Math\.log$' } }
            - kind: call_expression
              has: { field: function, regex: '^honoLogger$' }
              any:
                - has: { field: arguments, regex: '^\(\s*\)$' }
                - has:
                    field: arguments
                    has:
                      kind: object
                      not: { has: { any: [{ kind: spread_element }, { kind: shorthand_property_identifier, regex: '^format$' }, { kind: pair, has: { field: key, regex: '^format$' } }] } }
                - has:
                    field: arguments
                    has:
                      kind: object
                      has:
                        kind: pair
                        all:
                          - has: { field: key, regex: '^format$' }
                          - has: { field: value, kind: string, regex: '^.(short|combined|common).$' }
      - id: no-request-url-in-logs
        language: javascript
        message: Logs a full request URL or a query value, which can hold a secret such as a GitHub manifest code; log the pathname, and give honoLogger a format that does.
        rule:
          any:
            - any:
                - { kind: member_expression, regex: '^(\w+\.)*(req|request|raw)\.url$' }
                - { kind: new_expression, regex: '^new URL\(\s*(\w+\.)*(req|request|raw)\.url\b' }
                - { kind: call_expression, has: { field: function, regex: '(^|\.)searchParams\.(get|getAll|toString|entries|values)$' } }
                - { kind: call_expression, has: { field: function, regex: '^(\w+\.)*(req|request)\.(query|queries)$' } }
              inside:
                stopBy: { not: { any: [{ kind: object }, { kind: pair }, { kind: array }, { kind: template_string }, { kind: template_substitution }, { kind: parenthesized_expression }, { kind: await_expression }, { kind: binary_expression, has: { field: operator, regex: '^(\+|\?\?|\|\|)$' } }, { kind: member_expression, has: { field: property, regex: '^(href|search|toString)$' } }, { kind: call_expression, has: { field: function, regex: '(\.toString|^String|^JSON\.stringify)$' } }, { kind: arguments, inside: { kind: call_expression, has: { field: function, regex: '^(String|JSON\.stringify)$' } } }] } }
                kind: arguments
                inside:
                  kind: call_expression
                  has: { field: function, regex: '^(console\.\w+|logJson|honoLogger|(\w+\.)*log|(\w+\.)*(log|logger)\.(trace|debug|info|warn|warning|error|fatal)|getLogger\([^)]*\)\.(trace|debug|info|warn|warning|error|fatal))$' }
                  not: { has: { field: function, regex: '^Math\.log$' } }
            - kind: call_expression
              has: { field: function, regex: '^honoLogger$' }
              any:
                - has: { field: arguments, regex: '^\(\s*\)$' }
                - has:
                    field: arguments
                    has:
                      kind: object
                      not: { has: { any: [{ kind: spread_element }, { kind: shorthand_property_identifier, regex: '^format$' }, { kind: pair, has: { field: key, regex: '^format$' } }] } }
                - has:
                    field: arguments
                    has:
                      kind: object
                      has:
                        kind: pair
                        all:
                          - has: { field: key, regex: '^format$' }
                          - has: { field: value, kind: string, regex: '^.(short|combined|common).$' }
      - id: no-dynamic-import
        language: typescript
        message: Dynamic import; AGENTS.md allows one only in the portal, for bundle splitting.
        ignores: [apps/web/**, "**/*.d.ts", "**/*.d.mts", "**/*.d.cts"]
        rule:
          kind: call_expression
          has: { field: function, kind: import }
          not: { inside: { stopBy: end, any: [{ kind: type_query }, { kind: type_annotation }, { kind: type_alias_declaration }, { kind: type_arguments }, { kind: interface_declaration }] } }
      - id: no-dynamic-import
        language: javascript
        message: Dynamic import; AGENTS.md allows one only in the portal, for bundle splitting.
        ignores: [apps/web/**]
        rule: { kind: call_expression, has: { field: function, kind: import } }
      - id: no-env-in-tests
        language: typescript
        message: A test reads the environment; pass the value in instead.
        files: ["**/*.{test,spec}.*", "**/{test,tests,Tests,__tests__}/**", "**/*.*{Test,Tests}/**"]
        rule:
          any:
            - pattern: process.env
            - pattern: Bun.env
            - pattern: import.meta.env
      - id: no-env-in-tests
        language: javascript
        message: A test reads the environment; pass the value in instead.
        files: ["**/*.{test,spec}.*", "**/{test,tests,Tests,__tests__}/**", "**/*.*{Test,Tests}/**"]
        rule:
          any:
            - pattern: process.env
            - pattern: Bun.env
            - pattern: import.meta.env
    onFail: fail
    reason: A stdout line crashes a workflow run and a logged URL leaked a GitHub manifest code; AGENTS.md keeps dynamic imports to the portal and process.env out of tests.
    evidence:
      - maintainer-stated
  - id: needs-a-person
    check: code-patterns
    text: Added code uses no any type and loads portal server data through TanStack Query.
    patterns:
      - id: no-any
        language: typescript
        message: "`any` turns type checking off; name the type, or take unknown and narrow it."
        ignores: ["**/*.{test,spec}.*", "**/{test,tests,Tests,__tests__}/**", "**/*.*{Test,Tests}/**"]
        rule: { kind: predefined_type, regex: '^any$' }
      - id: no-effect-fetching
        language: typescript
        message: An effect loads server data; load it with a TanStack Query query.
        files: [apps/web/**]
        ignores: ["**/*.{test,spec}.*", "**/{test,tests,Tests,__tests__}/**", "**/*.*{Test,Tests}/**"]
        rule:
          kind: call_expression
          all:
            - has: { field: function, regex: '^(React\.)?use(Layout)?Effect$' }
            - has:
                field: arguments
                has:
                  stopBy: end
                  kind: call_expression
                  not: { inside: { stopBy: end, kind: call_expression, has: { field: function, regex: '\.(prefetchQuery|prefetchInfiniteQuery|ensureQueryData|fetchQuery|fetchInfiniteQuery)$' } } }
                  any:
                    - has: { field: function, regex: '^(\w+\.)*fetch$' }
                    - has: { field: arguments, has: { nthChild: 1, regex: '^((\w+\.)*transport|create\w*HubTransport\(\))$' } }
                    - has: { field: function, kind: member_expression, has: { field: object, regex: '^(\w+\.)*transport$' } }
                    - all:
                        - has: { field: function, kind: identifier, pattern: $F }
                        - inside:
                            stopBy: end
                            kind: program
                            has:
                              kind: import_statement
                              all:
                                - has: { field: source, regex: 'hub-auth(\.tsx?)?.$' }
                                - has:
                                    stopBy: end
                                    kind: import_specifier
                                    any:
                                      - has: { field: alias, pattern: $F }
                                      - all:
                                          - not: { has: { field: alias, kind: identifier } }
                                          - has: { field: name, pattern: $F }
      - id: no-effect-fetching
        language: javascript
        message: An effect loads server data; load it with a TanStack Query query.
        files: [apps/web/**]
        ignores: ["**/*.{test,spec}.*", "**/{test,tests,Tests,__tests__}/**", "**/*.*{Test,Tests}/**"]
        rule:
          kind: call_expression
          all:
            - has: { field: function, regex: '^(React\.)?use(Layout)?Effect$' }
            - has:
                field: arguments
                has:
                  stopBy: end
                  kind: call_expression
                  not: { inside: { stopBy: end, kind: call_expression, has: { field: function, regex: '\.(prefetchQuery|prefetchInfiniteQuery|ensureQueryData|fetchQuery|fetchInfiniteQuery)$' } } }
                  any:
                    - has: { field: function, regex: '^(\w+\.)*fetch$' }
                    - has: { field: arguments, has: { nthChild: 1, regex: '^((\w+\.)*transport|create\w*HubTransport\(\))$' } }
                    - has: { field: function, kind: member_expression, has: { field: object, regex: '^(\w+\.)*transport$' } }
                    - all:
                        - has: { field: function, kind: identifier, pattern: $F }
                        - inside:
                            stopBy: end
                            kind: program
                            has:
                              kind: import_statement
                              all:
                                - has: { field: source, regex: 'hub-auth(\.tsx?)?.$' }
                                - has:
                                    stopBy: end
                                    kind: import_specifier
                                    any:
                                      - has: { field: alias, pattern: $F }
                                      - all:
                                          - not: { has: { field: alias, kind: identifier } }
                                          - has: { field: name, pattern: $F }
    onFail: ask
    reason: AGENTS.md keeps types checked, and apps/web/AGENTS.md sends server data through TanStack Query, never useEffect.
    evidence:
      - maintainer-stated
  - id: invented-fallbacks
    check: code-patterns
    text: Added code handles a missing value instead of inventing an empty one.
    patterns:
      - id: more-invented-fallbacks
        language: typescript
        message: Invented fallback (an empty string, || [] or || 0); handle the missing value instead.
        ignores: ["**/*.{test,spec}.*", "**/{test,tests,Tests,__tests__}/**", "**/*.*{Test,Tests}/**"]
        rule:
          any:
            - pattern: $X || []
            - all:
                - any:
                    - pattern: $X ?? ""
                    - pattern: $X ?? ''
                    - pattern: $X ?? ``
                    - pattern: $X || ""
                    - pattern: $X || ''
                    - pattern: $X || ``
                - not:
                    any:
                      - inside: { kind: template_substitution }
                      - inside: { kind: binary_expression, has: { field: operator, regex: '^\+$' } }
                      - inside: { kind: parenthesized_expression, inside: { kind: binary_expression, has: { field: operator, regex: '^\+$' } } }
                      - has: { field: left, kind: subscript_expression }
                      - has: { field: left, kind: call_expression, has: { field: function, regex: '\.(at|get|getAttribute)$' } }
            - all:
                - pattern: $X || 0
                - not:
                    any:
                      - inside: { kind: binary_expression, has: { field: operator, regex: '^[-+*/%]$' } }
                      - inside: { kind: parenthesized_expression, inside: { kind: binary_expression, has: { field: operator, regex: '^[-+*/%]$' } } }
                      - inside: { kind: augmented_assignment_expression }
      - id: more-invented-fallbacks
        language: javascript
        message: Invented fallback (an empty string, || [] or || 0); handle the missing value instead.
        ignores: ["**/*.{test,spec}.*", "**/{test,tests,Tests,__tests__}/**", "**/*.*{Test,Tests}/**"]
        rule:
          any:
            - pattern: $X || []
            - all:
                - any:
                    - pattern: $X ?? ""
                    - pattern: $X ?? ''
                    - pattern: $X ?? ``
                    - pattern: $X || ""
                    - pattern: $X || ''
                    - pattern: $X || ``
                - not:
                    any:
                      - inside: { kind: template_substitution }
                      - inside: { kind: binary_expression, has: { field: operator, regex: '^\+$' } }
                      - inside: { kind: parenthesized_expression, inside: { kind: binary_expression, has: { field: operator, regex: '^\+$' } } }
                      - has: { field: left, kind: subscript_expression }
                      - has: { field: left, kind: call_expression, has: { field: function, regex: '\.(at|get|getAttribute)$' } }
            - all:
                - pattern: $X || 0
                - not:
                    any:
                      - inside: { kind: binary_expression, has: { field: operator, regex: '^[-+*/%]$' } }
                      - inside: { kind: parenthesized_expression, inside: { kind: binary_expression, has: { field: operator, regex: '^[-+*/%]$' } } }
                      - inside: { kind: augmented_assignment_expression }
    onFail: label
    reason: AGENTS.md allows a fallback only where a real default exists.
    evidence:
      - maintainer-stated
actions:
  pass:
    - do: approve
      when:
        author:
          - users:
              - thegreataxios
              - brianjfox
    - do: request-review
      target:
        to: codeowners
      when:
        author:
          - external
  fail:
    - do: close
      when:
        linkedIssue: false
    - do: request-changes
  unsure:
    - do: assign
      target:
        to: users
        users:
          - thegreataxios
      when:
        author:
          - maintainers
