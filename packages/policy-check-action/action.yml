name: Check Corbits Triage policy
description: Checks .corbits-triage.yml as the Corbits Triage hub reads it and marks each problem on its line; on a pull request, runs its rules that need no model.
inputs:
  github-token:
    description: Token for reading the pull request; read access is enough.
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.4
    - name: Install
      shell: bash
      working-directory: ${{ github.action_path }}/../..
      run: bun install --frozen-lockfile --filter @corbits/policy-check-action
    - name: Check policy
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: bun --conditions=intx-src src/main.ts "$GITHUB_WORKSPACE" "$GITHUB_REPOSITORY"
