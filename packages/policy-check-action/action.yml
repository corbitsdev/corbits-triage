name: Check Corbits Triage policy
description: Checks .corbits-triage.yml as the Corbits Triage hub reads it and marks each problem on its line.
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.2
    - name: Install
      shell: bash
      working-directory: ${{ github.action_path }}/../..
      run: bun install --frozen-lockfile --filter @corbits/policy-check-action
    - name: Check policy file
      shell: bash
      working-directory: ${{ github.action_path }}
      run: bun src/main.ts "$GITHUB_WORKSPACE" "$GITHUB_REPOSITORY"
