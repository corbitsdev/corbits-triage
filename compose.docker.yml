# Code review on this machine's Docker: docker compose -f compose.yml -f compose.docker.yml up --build -d
# The socket gives the hub control of this machine's Docker.
services:
  sidecar-image:
    build: { context: ., target: sidecar }
    image: corbits-triage-sidecar
    entrypoint: ["true"]
  hub:
    volumes: ["${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock"]
    depends_on: { sidecar-image: { condition: service_completed_successfully } }
