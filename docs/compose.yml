services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: interchange
      POSTGRES_PASSWORD: interchange
      POSTGRES_DB: interchange
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "interchange"]
      interval: 2s
    restart: unless-stopped
  hub:
    build: { context: .., dockerfile: docs/Dockerfile }
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://interchange:interchange@postgres:5432/interchange
      HUB_DATA_DIR: /data
      PORT: "3000"
      BETTER_AUTH_BASE_URL: http://localhost:3000
    volumes: [hub-data:/data]
    ports: ["3000:3000"]
    depends_on: { postgres: { condition: service_healthy } }
    restart: unless-stopped
volumes:
  postgres:
  hub-data:
