services:
  postgres:
    image: postgres:17
    command: postgres -c idle_in_transaction_session_timeout=10min
    environment:
      POSTGRES_USER: interchange
      POSTGRES_PASSWORD: interchange
      POSTGRES_DB: interchange
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "interchange"]
      interval: 2s
    restart: unless-stopped
  migrate:
    build: .
    image: corbits-triage-hub
    env_file: .env
    environment:
      DATABASE_URL: postgres://interchange:interchange@postgres:5432/interchange
    command: ["bun", "run", "db:migrate"]
    depends_on: { postgres: { condition: service_healthy } }
  hub:
    build: .
    image: corbits-triage-hub
    env_file: .env
    environment:
      DATABASE_URL: postgres://interchange:interchange@postgres:5432/interchange
      HUB_DATA_DIR: /data
      PORT: "3000"
      BETTER_AUTH_BASE_URL: http://localhost:3000
    volumes: [hub-data:/data]
    ports: ["3000:3000"]
    depends_on: { migrate: { condition: service_completed_successfully } }
    restart: unless-stopped
volumes:
  postgres:
  hub-data:
