name: Image

# Builds one image natively on each platform's runner, scans it, and on a push to main joins the platforms under its
# tags.
on:
  workflow_call:
    inputs:
      name:
        type: string
        required: true
      target:
        type: string
        default: ""
      build-args:
        type: string
        default: ""
    outputs:
      image:
        description: The pushed image pinned by digest; empty when nothing was pushed.
        value: ${{ jobs.manifest.outputs.image }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/corbitsdev/${{ inputs.name }}
  PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: env.PUSH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image to scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ inputs.target }}
          build-args: ${{ inputs.build-args }}
          load: true
          tags: ${{ inputs.name }}:scan
          cache-from: type=gha,scope=${{ inputs.name }}-${{ matrix.arch }}
          no-cache-filters: app
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ inputs.name }}:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
      - name: Image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ inputs.target }}
          build-args: ${{ inputs.build-args }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ env.PUSH }}
          cache-from: type=gha,scope=${{ inputs.name }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ inputs.name }}-${{ matrix.arch }},mode=max
          no-cache-filters: app
      - if: env.PUSH == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
      - if: env.PUSH == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digest-${{ inputs.name }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error

  manifest:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.manifest.outputs.image }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: digest-${{ inputs.name }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create -t "$IMAGE:main" -t "$IMAGE:$GITHUB_SHA" "${sources[@]}"
          digest=$(docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA" --format '{{json .Manifest}}' | jq -r .digest)
          echo "image=$IMAGE@$digest" >> "$GITHUB_OUTPUT"
